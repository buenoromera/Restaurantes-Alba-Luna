<style>

    --cream: #FAF7F2;
    --warm: #F5EDE0;
    --sand: #E8D5BE;
    --terracota: #C8553D;
    --terracota-light: #E8775F;
    --green: #4A7C59;
    --green-light: #6BA07A;
    --text: #2C2416;
    --text-muted: #7A6A55;
    --card: #FFFFFF;
    --border: #E0D4C0;
    --alejandro: #3B72A8;
    --alejandro-light: #EBF2FA;
    --alba: #C8553D;
    --alba-light: #FAEDE9;
    --both: #6B4FA0;
    --both-light: #F0EBF8;

  * { box-sizing: border-box; margin: 0; padding: 0; }

    color: var(--text);

  /* ===== SPLASH SCREEN ===== */

    align-items: center; justify-content: center;
    z-index: 1000;
    padding: 40px 20px;
  }
  .splash-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 8vw, 52px);
    font-weight: 700;
    color: var(--text);
    text-align: center;
    margin-bottom: 8px;
    line-height: 1.1;
  }
  .splash-subtitle {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 56px;
    text-align: center;
  }
  .profile-grid {
    display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
  }
  .profile-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 32px 40px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.25s ease;
    min-width: 160px;
    text-decoration: none;
  }
  .profile-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.1);
  }
  .profile-btn.ale:hover { border-color: var(--alejandro); }
  .profile-btn.alba:hover { border-color: var(--alba); }
  .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  .profile-btn.ale .profile-avatar { background: var(--alejandro-light); }
  .profile-btn.alba .profile-avatar { background: var(--alba-light); }
  .profile-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 600;
    color: var(--text);
  }

  /* ===== MAIN APP ===== */
  #app { display: none; min-height: 100vh; }

  /* Header */
  .app-header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner {
    max-width: 700px; margin: 0 auto;
    display: flex; align-items: center;
    gap: 16px; height: 60px;
  }
  .header-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
    flex: 1;
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .user-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 8px;
    border-radius: 20px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .user-pill.ale { background: var(--alejandro-light); color: var(--alejandro); border-color: var(--alejandro); }
  .user-pill.alba { background: var(--alba-light); color: var(--alba); border-color: var(--alba); }

  /* Nav */
  .app-nav {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .nav-inner {
    max-width: 700px; margin: 0 auto;
    display: flex; gap: 0;
  }
  .nav-btn {
    padding: 12px 18px;
    background: none; border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 400;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .nav-btn.active { color: var(--terracota); border-bottom-color: var(--terracota); font-weight: 500; }
  .nav-btn:hover:not(.active) { color: var(--text); }

  /* Content */
  .content { max-width: 700px; margin: 0 auto; padding: 20px 16px 80px; }

  /* Category section */
  .category-section { margin-bottom: 32px; }
  .category-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .category-label {
    font-family: 'Playfair Display', serif;
    font-size: 18px; font-weight: 600;

  .category-count {

    background: var(--warm);

  }

    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 14px;

  .restaurant-card.visited { background: var(--warm); }
  .restaurant-card.pending { background: var(--card); }

  .card-emoji { font-size: 22px; flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-name { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .card-badges { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }

  .badge {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .badge.ale { background: var(--alejandro-light); color: var(--alejandro); }
  .badge.alba { background: var(--alba-light); color: var(--alba); }
  .badge.empty { background: var(--warm); color: var(--text-muted); opacity: 0.4; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 500;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 700px;
    padding: 28px 24px 48px;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700;
    margin-bottom: 4px;

  .modal-category { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .modal-section-title { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

  .visit-row.alba { background: var(--alba-light); }

  .toast.show { transform: translateX(-50%) translateY(0); }

</head>

const CATEGORY_EMOJI = {
  'Asiático':'🍣','Vegetariano':'🥦','Mexicano':'🌮','Hamburgueserías':'🍔',
  'Italianos':'🍕','Bocatas':'🥪','Vermut':'🥂','Restaurantes':'🍽️',

// ---- USER ----
function selectUser(user) {
  currentUser = user;
  document.getElementById('splash').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const pill = document.getElementById('userPill');
  pill.className = 'user-pill ' + (user === 'alejandro' ? 'ale' : 'alba');
  document.getElementById('userEmoji').textContent = user === 'alejandro' ? '👨' : '👩';
  document.getElementById('userName').textContent = user === 'alejandro' ? 'Alejandro' : 'Alba Luna';
  loadData();
}

function logout() {
  currentUser = null;
  document.getElementById('splash').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ---- DATA ----
async function loadData() {
  try {
    const res = await fetch(BASE_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } });
    const json = await res.json();
    const saved = json.record.restaurants || [];
    if (saved.length === 0) {
      restaurants = INITIAL_RESTAURANTS.map(r => ({...r}));
      await saveData();
    } else {
      // Merge: keep saved data but add any new restaurant from INITIAL_RESTAURANTS
      const savedIds = new Set(saved.map(r => r.id));
      const merged = [...saved];
      for (const init of INITIAL_RESTAURANTS) {
        if (!savedIds.has(init.id)) merged.push({...init});
      }
      restaurants = merged;
    }
  } catch(e) {
    restaurants = INITIAL_RESTAURANTS.map(r => ({...r}));
  }
  renderList();
  renderPending();
}

async function saveData() {
  try {
    await fetch(BASE_URL, {
      method: 'PUT',
      headers: HEADERS,
      body: JSON.stringify({ restaurants })
    });
  } catch(e) { showToast('Error al guardar 😞'); }
}

// ---- TABS ----
function showTab(tab) {
  ['list','pending','add'].forEach(t => {
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['list','pending','add'][i] === tab);
  });
}

// ---- RENDER LIST ----
function renderList() {
  const container = document.getElementById('tabList');
  let html = '';
  for (const cat of CATEGORIES_ORDER) {
    const items = restaurants.filter(r => r.category === cat);
    if (!items.length) continue;
    html += `<div class="category-section">
      <div class="category-header">
        <span style="font-size:20px">${CATEGORY_EMOJI[cat]||'🍽️'}</span>
        <span class="category-label">${cat}</span>
        <span class="category-count">${items.length}</span>
      </div>`;
    for (const r of items) {
      const aleVisited = r.visitedAlejandro;
      const albaVisited = r.visitedAlba;
      const bothVisited = aleVisited && albaVisited;
      html += `<div class="restaurant-card ${(aleVisited || albaVisited) ? 'visited' : 'pending'}" onclick="openModal('${r.id}')">
        <span class="card-emoji">${r.emoji}</span>
        <div class="card-body">
          <div class="card-name">${r.name}</div>
          ${r.location ? `<div class="card-meta">📍 ${r.location}</div>` : ''}
        </div>
        <div class="card-badges">
          <div class="badge ${aleVisited ? 'ale' : 'empty'}" title="${aleVisited ? 'Alejandro ha ido' : 'Alejandro no ha ido'}">A</div>
          <div class="badge ${albaVisited ? 'alba' : 'empty'}" title="${albaVisited ? 'Alba Luna ha ido' : 'Alba Luna no ha ido'}">L</div>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

// ---- RENDER PENDING ----
function renderPending() {
  const container = document.getElementById('tabPending');
  const pending = restaurants.filter(r => !r.visitedAlba && !r.visitedAlejandro);
  const byCategory = {};
  for (const r of pending) {
    if (!byCategory[r.category]) byCategory[r.category] = [];
    byCategory[r.category].push(r);
  }
  let html = `<div class="pending-hero">
    <div class="pending-hero-emoji">🗺️</div>
    <div class="pending-hero-title">¿Dónde podemos comer?</div>
    <div class="pending-hero-sub">${pending.length} sitios pendientes por descubrir juntos</div>
  </div>`;
  for (const cat of CATEGORIES_ORDER) {
    if (!byCategory[cat]) continue;
    html += `<div class="category-section">
      <div class="category-header">
        <span style="font-size:20px">${CATEGORY_EMOJI[cat]||'🍽️'}</span>
        <span class="category-label">${cat}</span>
        <span class="category-count">${byCategory[cat].length}</span>
      </div>`;
    for (const r of byCategory[cat]) {
      html += `<div class="restaurant-card pending" onclick="openModal('${r.id}')">
        <span class="card-emoji">${r.emoji}</span>
        <div class="card-body">
          <div class="card-name">${r.name}</div>
          ${r.location ? `<div class="card-meta">📍 ${r.location}</div>` : ''}
        </div>
        <div class="card-badges">
          <div class="badge empty">A</div>
          <div class="badge empty">L</div>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

// ---- MODAL ----
function openModal(id) {
  const r = restaurants.find(x => x.id === id);
  if (!r) return;
  const today = new Date().toLocaleDateString('es-ES');
  let html = `<div class="modal-title">${r.emoji} ${r.name}</div>
    <div class="modal-category">${r.category}${r.location ? ' · 📍 ' + r.location : ''}</div>`;

  html += `<div class="modal-section">
    <div class="modal-section-title">¿Quién ha estado?</div>`;

  // Alejandro
  html += `<div class="visit-row ale">
    <div class="visit-avatar">👨</div>
    <div class="visit-info">
      <div class="visit-name">Alejandro</div>
      <div class="visit-date">${r.visitedAlejandro ? ('✅ Visitado' + (r.dateAlejandro ? ' · ' + r.dateAlejandro : '')) : '⬜ Pendiente'}</div>
    </div>`;
  if (!r.visitedAlejandro) {
    html += `<button class="mark-btn ale" onclick="markVisit('${id}','alejandro','${today}')">Marcar ✓</button>`;
  } else {
    html += `<span class="mark-btn visited-btn">✓ Hecho</span>`;
  }
  html += `</div>`;

  // Alba Luna
  html += `<div class="visit-row alba">
    <div class="visit-avatar">👩</div>
    <div class="visit-info">
      <div class="visit-name">Alba Luna</div>
      <div class="visit-date">${r.visitedAlba ? ('✅ Visitado' + (r.dateAlba ? ' · ' + r.dateAlba : '')) : '⬜ Pendiente'}</div>
    </div>`;
  if (!r.visitedAlba) {
    html += `<button class="mark-btn alba" onclick="markVisit('${id}','alba','${today}')">Marcar ✓</button>`;
  } else {
    html += `<span class="mark-btn visited-btn">✓ Hecho</span>`;
  }
  html += `</div></div>`;

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

async function markVisit(id, who, date) {
  const r = restaurants.find(x => x.id === id);
  if (!r) return;
  if (who === 'alejandro') { r.visitedAlejandro = true; r.dateAlejandro = date; }
  if (who === 'alba') { r.visitedAlba = true; r.dateAlba = date; }
  await saveData();
  renderList();
  renderPending();
  openModal(id);
  showToast('¡Marcado! 🎉');
}

// ---- ADD ----
async function addRestaurant() {
  const name = document.getElementById('addName').value.trim();
  const category = document.getElementById('addCategory').value;
  const location = document.getElementById('addLocation').value.trim();
  if (!name) { showToast('Escribe el nombre del restaurante'); return; }
  const emoji = CATEGORY_EMOJI[category] || '🍽️';
  const id = 'u' + Date.now();
  restaurants.push({ id, name, category, emoji, location,
    visitedAlba: false, visitedAlejandro: false, dateAlba: '', dateAlejandro: '' });
  await saveData();
  renderList();
  renderPending();
  document.getElementById('addName').value = '';
  document.getElementById('addLocation').value = '';
  showToast('¡Restaurante añadido! 🍽️');
  showTab('list');
}

// ---- TOAST ----
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
